<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRICE ROLE PININFARINA BATTISTA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Mono', monospace;
            background-color: #f4f4f0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-title {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 25px;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-title img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: #ffffff;
            border: 3px solid #000;
            box-shadow: 4px 4px 0px #000;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 180px;
            position: relative;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .card:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .icon-box {
            width: 35px;
            height: 35px;
            background-color: #e84a22;
            border: 2px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: bold;
            border: 2px solid #000;
            color: white;
        }

        .badge-red { background-color: #f44336; }

        .card-content h2 {
            font-size: 1rem;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .card-content p {
            font-size: 0.8rem;
            color: #555;
            line-height: 1.4;
            text-transform: capitalize;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status-open {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #00c853;
            border: 1px solid #000;
            display: inline-block;
        }

        .arrow {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 8px 8px 0 #000;
            width: 100%;
            max-width: 350px;
            padding: 20px;
            position: relative;
            text-align: center;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-box h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-transform: capitalize;
            border-bottom: 2px dashed #000;
            padding-bottom: 10px;
        }

        .price-list {
            text-align: left;
            margin-bottom: 20px;
            background: #f9f9f9;
            padding: 10px;
            border: 2px solid #000;
        }

        .price-list p {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: capitalize;
        }

        .price-list span {
            color: #e84a22;
        }

        .contact-title {
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: capitalize;
        }

        .contact-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #000;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            font-weight: bold;
            text-decoration: none;
            color: #000;
            text-align: center;
            transition: background 0.2s;
            text-transform: capitalize;
        }

        .contact-btn:hover {
            background: #e0e0e0;
        }

        .btn-tg { background: #229ED9; color: white; border-color: #000; }
        .btn-tg:hover { background: #1a7eb0; }
        
        .btn-wa { background: #25D366; color: white; border-color: #000; }
        .btn-wa:hover { background: #1ebc57; }

        .btn-info { background: #FFC107; color: black; border-color: #000; }
        .btn-info:hover { background: #e0a800; }

        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #e84a22;
            color: white;
            border: 3px solid #000;
            width: 35px;
            height: 35px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .close-btn:active {
            transform: scale(0.9);
        }

        .video-scroll-container {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .video-scroll-container::-webkit-scrollbar {
            height: 8px;
        }

        .video-scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border: 1px solid #000;
        }

        .video-scroll-container::-webkit-scrollbar-thumb {
            background: #e84a22;
            border: 1px solid #000;
        }

        .video-item {
            flex: 0 0 85%;
            scroll-snap-align: center;
            border: 3px solid #000;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-item video {
            width: 100%;
            height: auto;
            display: block;
        }

        .modal-box.wide {
            max-width: 400px;
            padding: 15px;
        }
    </style>
</head>
