<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shop MirulZtyzz</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --paper-bg: #fdfbf7;
            --ink-color: #2c3e50;
            --ink-light: #555555;
            --marker-red: #e74c3c;
            --marker-blue: #3498db;
            --shadow-color: #2c3e50;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Patrick Hand', cursive;
            background-color: var(--paper-bg);
            color: var(--ink-color);
            overflow-x: hidden;
            position: relative;
            font-size: 16px;
            line-height: 1.5;
        }

        .grid-bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--paper-bg);
            background-image: 
                linear-gradient(90deg, transparent 79px, var(--marker-red) 79px, var(--marker-red) 81px, transparent 81px),
                linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 30px, 100% 30px;
            z-index: -2;
        }

        .header {
            position: fixed; top: 0; width: 100%;
            background: rgba(253, 251, 247, 0.95);
            border-bottom: 3px dashed var(--ink-color);
            z-index: 1000; padding: 12px 0;
        }

        .nav-container {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between;
            align-items: center; padding: 0 16px;
        }

        .logo { display: flex; align-items: center; text-decoration: none; color: var(--ink-color); }

        .logo-icon {
            width: 32px; height: 32px; margin-right: 10px;
            border: 3px solid var(--ink-color);
            border-radius: 4px 12px 4px 12px;
            transform: rotate(10deg);
            background: var(--paper-bg);
            display: flex; align-items: center; justify-content: center;
        }
        
        .logo-icon i { font-size: 16px; color: var(--ink-color); transform: rotate(-10deg); }

        .logo-text {
            font-family: 'Caveat', cursive;
            font-size: 26px; font-weight: 700; letter-spacing: 1px;
        }

        .header-right { display: flex; align-items: center; gap: 10px; }
        .dots-menu-wrapper { position: relative; }

        .dots-btn {
            width: 42px; height: 42px;
            background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 50% 40% 50% 40%;
            color: var(--ink-color);
            cursor: pointer;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 4px;
            box-shadow: 3px 3px 0 var(--ink-color);
            transition: all 0.2s ease;
            padding: 0;
        }

        .dots-btn span {
            display: block; width: 20px; height: 3px;
            background: var(--ink-color); border-radius: 2px;
            transition: all 0.3s ease;
        }

        .dots-btn:hover {
            background: var(--marker-blue);
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink-color);
        }
        .dots-btn:hover span { background: #fff; }
        .dots-btn.active { background: var(--marker-red); }
        .dots-btn.active span { background: #fff; }

        .dots-dropdown {
            position: absolute;
            top: calc(100% + 12px); right: 0;
            background: var(--paper-bg);
            border: 3px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px / 5px 20px 5px 20px;
            box-shadow: 6px 6px 0 var(--shadow-color);
            min-width: 240px; padding: 10px;
            opacity: 0; visibility: hidden;
            transform: translateY(-10px) rotate(-2deg);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .dots-dropdown.active {
            opacity: 1; visibility: visible;
            transform: translateY(0) rotate(0deg);
        }

        .dots-dropdown::before {
            content: ''; position: absolute;
            top: -12px; right: 18px;
            width: 0; height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 12px solid var(--ink-color);
        }

        .dots-dropdown::after {
            content: ''; position: absolute;
            top: -6px; right: 21px;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 9px solid var(--paper-bg);
        }

        .dropdown-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 15px;
            color: var(--ink-color); text-decoration: none;
            font-family: 'Patrick Hand', cursive;
            font-size: 17px; font-weight: 600;
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            border-bottom: 2px dashed #e0e0e0;
        }

        .dropdown-item:last-child { border-bottom: none; }

        .dropdown-item:hover {
            background: #f0ebe0;
            transform: translateX(4px);
        }

        .dropdown-item i {
            width: 30px; height: 30px;
            border-radius: 50% 40% 50% 40%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; color: #fff;
            flex-shrink: 0;
            border: 2px solid var(--ink-color);
        }

        .dropdown-item .icon-home { background: var(--marker-blue); }
        .dropdown-item .icon-wa { background: #25D366; }
        .dropdown-item .icon-tg { background: #0088cc; }

        .dropdown-item-info { display: flex; flex-direction: column; line-height: 1.2; }

        .dropdown-item-title {
            font-weight: 700; font-family: 'Caveat', cursive; font-size: 20px;
        }

        .dropdown-item-sub {
            font-size: 12px; color: var(--ink-light);
            font-family: 'Patrick Hand', cursive;
        }

        .dropdown-divider {
            height: 2px; background: var(--ink-color);
            margin: 8px 10px; border-radius: 2px; opacity: 0.3;
        }

        .hero {
            min-height: 85vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; padding: 70px 16px 40px;
        }

        .carousel-container {
            width: 100%; max-width: 100%;
            height: 520px; perspective: 1000px;
            position: relative; padding-top: 10px;
        }

        .carousel {
            width: 100%; height: 100%;
            position: relative; transform-style: preserve-3d;
        }

        .carousel-item {
            position: absolute;
            width: 280px; height: 400px;
            left: 50%; top: 50%;
            transform-style: preserve-3d;
            transition: all 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer; transform-origin: center center;
        }

        .carousel-item .card {
            width: 100%; height: 100%;
            background: var(--paper-bg);
            border: 3px solid var(--ink-color);
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            box-shadow: 8px 8px 0px var(--shadow-color);
            padding: 25px 20px;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center;
        }

        .card-number {
            position: absolute; top: 10px; right: 20px;
            font-family: 'Caveat', cursive;
            font-size: 50px; font-weight: 700;
            color: var(--marker-red); line-height: 1;
            z-index: 1; transform: rotate(10deg); opacity: 0.5;
        }

        .service-name-box {
            width: 100%; padding: 20px 15px;
            margin: 25px auto 15px;
            border: 3px solid var(--ink-color);
            background: #fff;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            position: relative; z-index: 2;
            transform: rotate(-1deg);
            box-shadow: 3px 3px 0 var(--ink-color);
            min-height: 100px;
        }

        .service-name-box::before {
            content: 'Layanan';
            position: absolute; top: -12px; left: 10px;
            background: var(--paper-bg); padding: 0 5px;
            font-size: 14px; color: var(--ink-light);
            font-family: 'Patrick Hand', cursive;
        }

        .service-name {
            font-family: 'Caveat', cursive;
            font-size: 24px; font-weight: 700;
            color: var(--ink-color); text-align: center;
            line-height: 1.2; text-transform: uppercase;
        }

        .card-description {
            color: var(--ink-light); line-height: 1.4;
            margin-bottom: 15px; font-size: 15px;
            text-align: center; position: relative; z-index: 2;
        }

        .card-tech {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-bottom: 20px; justify-content: center;
            position: relative; z-index: 2;
        }

        .tech-badge {
            padding: 2px 10px; background: #fff;
            border: 2px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px / 5px 20px 5px 20px;
            font-size: 13px; color: var(--ink-color); font-weight: 600;
        }

        .card-cta {
            padding: 12px 20px; background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 10px 20px 10px 20px;
            color: var(--ink-color); font-weight: 700;
            font-size: 18px; font-family: 'Patrick Hand', cursive;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.2s ease;
            display: block; margin: auto auto 0;
            position: relative; z-index: 2;
            box-shadow: 3px 3px 0 var(--ink-color);
            width: 100%; text-align: center;
        }

        .card-cta:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink-color);
            background: var(--marker-red); color: #fff;
        }

        .carousel-controls {
            position: absolute; bottom: -50px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 20px; z-index: 100;
        }

        .carousel-btn {
            width: 50px; height: 50px; background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 50% 40% 50% 40%;
            color: var(--ink-color); font-size: 24px; font-weight: bold;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 3px 3px 0 var(--ink-color);
        }

        .carousel-btn:hover {
            background: var(--marker-blue); color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink-color);
        }

        .carousel-indicators {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100;
        }

        .indicator {
            width: 12px; height: 12px; background: #fff;
            border: 2px solid var(--ink-color);
            border-radius: 50% 40% 50% 40%;
            cursor: pointer; transition: all 0.2s ease;
        }

        .indicator.active {
            background: var(--marker-red);
            transform: scale(1.3) rotate(20deg);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--paper-bg);
            background-image: 
                linear-gradient(90deg, transparent 79px, var(--marker-red) 79px, var(--marker-red) 81px, transparent 81px),
                linear-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 100% 30px, 100% 30px;
            z-index: 9999;
            overflow-y: auto;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-header {
            position: sticky; top: 0;
            background: rgba(253, 251, 247, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 3px dashed var(--ink-color);
            padding: 15px 20px;
            display: flex; justify-content: space-between;
            align-items: center; z-index: 10;
        }

        .modal-header-left { display: flex; align-items: center; gap: 12px; }

        .modal-header-back {
            width: 40px; height: 40px; background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 50% 40% 50% 40%;
            color: var(--ink-color); font-size: 20px;
            cursor: pointer; display: flex;
            align-items: center; justify-content: center;
            box-shadow: 3px 3px 0 var(--ink-color);
            transition: all 0.2s ease; flex-shrink: 0;
        }

        .modal-header-back:hover {
            background: var(--marker-blue); color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink-color);
        }

        .modal-header-title {
            font-family: 'Caveat', cursive;
            font-size: 24px; font-weight: 700;
            color: var(--ink-color);
            text-transform: uppercase; line-height: 1.1;
        }

        .modal-header-subtitle {
            font-size: 13px; color: var(--ink-light);
            font-family: 'Patrick Hand', cursive;
        }

        .modal-body {
            padding: 30px 20px 60px;
            max-width: 600px; margin: 0 auto;
        }

        .modal-main-title {
            font-family: 'Caveat', cursive;
            font-size: 36px; font-weight: 700;
            color: var(--ink-color); text-align: center;
            text-transform: uppercase; line-height: 1.1;
            margin-bottom: 8px;
        }

        .modal-main-subtitle {
            font-family: 'Patrick Hand', cursive;
            font-size: 16px; color: var(--ink-light);
            text-align: center; margin-bottom: 30px;
            text-decoration: underline wavy var(--marker-red) 1px;
            text-underline-offset: 5px;
        }

        .pricing-list {
            display: flex; flex-direction: column; gap: 20px;
        }

        .pricing-box {
            background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px / 5px 20px 5px 20px;
            box-shadow: 5px 5px 0px var(--shadow-color);
            padding: 20px 22px;
            position: relative;
            transition: all 0.3s ease;
            display: flex; justify-content: space-between;
            align-items: center; gap: 15px; flex-wrap: wrap;
        }

        .pricing-box:hover {
            transform: translate(-3px, -3px);
            box-shadow: 8px 8px 0px var(--shadow-color);
        }

        .pricing-info {
            display: flex; flex-direction: column;
            gap: 6px; flex: 1; min-width: 180px;
        }

        .plan-name {
            font-family: 'Caveat', cursive;
            font-size: 24px; font-weight: 700;
            color: var(--ink-color); line-height: 1.1;
            text-transform: uppercase;
        }

        .plan-price {
            font-family: 'Caveat', cursive;
            font-size: 28px; font-weight: 700;
            color: var(--marker-red); line-height: 1;
        }

        .plan-select {
            padding: 10px 18px; background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 10px 20px 10px 20px;
            color: var(--ink-color); font-weight: 700;
            font-size: 15px; font-family: 'Patrick Hand', cursive;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.2s ease; display: block;
            box-shadow: 3px 3px 0 var(--ink-color);
            white-space: nowrap; flex-shrink: 0;
        }

        .plan-select:hover {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 var(--ink-color);
            background: var(--marker-red); color: #fff;
        }

        .form-section {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 3px dashed var(--ink-color);
            display: none;
        }

        .form-section.active {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-family: 'Caveat', cursive;
            font-size: 28px; font-weight: 700;
            color: var(--ink-color); text-align: center;
            text-transform: uppercase; margin-bottom: 8px;
        }

        .form-subtitle {
            font-family: 'Patrick Hand', cursive;
            font-size: 15px; color: var(--ink-light);
            text-align: center; margin-bottom: 25px;
        }

        .selected-info {
            background: #fff8f0;
            border: 3px solid var(--marker-red);
            border-radius: 20px 5px 20px 5px / 5px 20px 5px 20px;
            padding: 15px 20px;
            margin-bottom: 25px;
            box-shadow: 4px 4px 0 var(--marker-red);
            text-align: center;
        }

        .selected-info-label {
            font-family: 'Patrick Hand', cursive;
            font-size: 13px; color: var(--ink-light);
            text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .selected-info-name {
            font-family: 'Caveat', cursive;
            font-size: 24px; font-weight: 700;
            color: var(--ink-color); line-height: 1.2;
        }

        .selected-info-price {
            font-family: 'Caveat', cursive;
            font-size: 26px; font-weight: 700;
            color: var(--marker-red); margin-top: 3px;
        }

        .form-group {
            margin-bottom: 18px; position: relative;
        }

        .form-label {
            font-family: 'Caveat', cursive;
            font-size: 20px; font-weight: 700;
            color: var(--ink-color); display: block;
            margin-bottom: 6px; padding-left: 5px;
        }

        .form-label i {
            color: var(--marker-red); margin-right: 5px; font-size: 16px;
        }

        .form-input {
            width: 100%; padding: 12px 16px;
            background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 15px 5px 15px 5px / 5px 15px 5px 15px;
            font-family: 'Patrick Hand', cursive;
            font-size: 16px; color: var(--ink-color);
            box-shadow: 3px 3px 0 var(--ink-color);
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--marker-red);
            box-shadow: 3px 3px 0 var(--marker-red);
            background: #fffbf8;
        }

        .form-input::placeholder {
            color: #bbb; font-style: italic;
        }

        .form-submit {
            width: 100%; padding: 14px 20px;
            background: var(--marker-blue);
            border: 3px solid var(--ink-color);
            border-radius: 10px 20px 10px 20px;
            color: #fff;
            font-family: 'Patrick Hand', cursive;
            font-size: 20px; font-weight: 700;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 4px 4px 0 var(--ink-color);
            margin-top: 10px;
        }

        .form-submit:hover {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink-color);
            background: var(--ink-color);
        }

        .payment-section {
            margin-top: 40px;
            padding-top: 25px;
            border-top: 3px dashed var(--ink-color);
            display: none;
        }

        .payment-section.active {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        .payment-qr-container {
            background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 20px 5px 20px 5px / 5px 20px 5px 20px;
            box-shadow: 6px 6px 0 var(--shadow-color);
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 30px;
            transform: rotate(-1deg);
        }

        .payment-qr-title {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            font-weight: 700;
            color: var(--ink-color);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .payment-qr-subtitle {
            font-family: 'Patrick Hand', cursive;
            font-size: 14px;
            color: var(--ink-light);
            margin-bottom: 20px;
        }

        .qr-image-wrapper {
            background: #fff;
            border: 3px solid var(--ink-color);
            border-radius: 15px 5px 15px 5px / 5px 15px 5px 15px;
            padding: 12px;
            display: inline-block;
            box-shadow: 3px 3px 0 var(--ink-color);
            margin-bottom: 15px;
        }

        .qr-image-wrapper img {
            width: 220px;
            height: 220px;
            object-fit: contain;
            display: block;
            border-radius: 8px;
        }

        .payment-amount-box {
            background: #fff8f0;
            border: 3px solid var(--marker-red);
            border-radius: 15px 5px 15px 5px / 5px 15px 5px 15px;
            padding: 12px 20px;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 3px 3px 0 var(--marker-red);
        }

        .payment-amount-label {
            font-family: 'Patrick Hand', cursive;
            font-size: 13px;
            color: var(--ink-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .payment-amount-value {
            font-family: 'Caveat', cursive;
            font-size: 32px;
            font-weight: 700;
            color: var(--marker-red);
            line-height: 1;
        }

        .footer {
            padding: 40px 20px; background: #fff;
            border-top: 3px dashed var(--ink-color);
            text-align: center; margin-top: 100px;
        }

        .footer-brand {
            display: flex; flex-direction: column;
            gap: 15px; align-items: center;
        }

        .footer-description {
            color: var(--ink-light); line-height: 1.5;
            font-size: 16px; max-width: 300px;
        }
        
        .footer-social { display: flex; gap: 15px; }

        .social-icon {
            width: 40px; height: 40px; background: #fff;
            border: 2px solid var(--ink-color);
            border-radius: 50% 40% 50% 40%;
            display: flex; align-items: center; justify-content: center;
            color: var(--ink-color); text-decoration: none;
            transition: all 0.2s ease; font-size: 18px;
            box-shadow: 2px 2px 0 var(--ink-color);
        }

        .social-icon:hover {
            background: var(--marker-blue); color: #fff;
            transform: translate(2px, 2px);
            box-shadow: 0px 0px 0 var(--ink-color);
        }

        .footer-bottom {
            padding-top: 20px; border-top: 2px dashed var(--ink-color);
            display: flex; justify-content: center;
            align-items: center; text-align: center;
        }

        .copyright {
            color: var(--ink-color); font-size: 16px; font-weight: 600;
        }

        @media (max-width: 768px) {
            .hero { padding: 70px 16px 30px; }
            .carousel-container { height: 480px; padding-top: 5px; }
            .carousel-item { width: 250px; height: 390px; }
            .card-number { font-size: 40px; }
            .service-name { font-size: 22px; }

            .modal-main-title { font-size: 28px; }
            .modal-body { padding: 25px 15px 50px; }
            .pricing-box { padding: 15px; gap: 10px; }
            .plan-name { font-size: 20px; }
            .plan-price { font-size: 24px; }
            .plan-select { padding: 8px 14px; font-size: 13px; }
            .modal-header-title { font-size: 20px; }

            .form-title { font-size: 24px; }
            .form-label { font-size: 18px; }
            .form-input { font-size: 15px; padding: 10px 14px; }
            .form-submit { font-size: 18px; }

            .qr-image-wrapper img { width: 180px; height: 180px; }
            .payment-amount-value { font-size: 26px; }
